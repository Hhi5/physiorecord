name: Release Multi-Platform (Web PWA + Universal Android APK + Windows EXE)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) to publish a GitHub Release when triggered manually'
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-and-build-web:
    name: Verify Quality Gates & Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: License compliance gate (GPL-3.0-or-later & allowlist)
        run: npm run check:licenses

      - name: Content license registry gate
        run: npm run check:content

      - name: TypeScript typecheck
        run: npm run lint

      - name: Unit & clinical verification tests
        run: npm test

      - name: Build Web PWA bundle
        run: npm run build:web

      - name: Performance budget check
        run: npm run check:perf

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Package Web PWA archive with GPL notices
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-v1.0.0}}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v$(node -p "require('./package.json').version")"
          fi
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md CONTENT_LICENSES.md dist/
          cd dist && zip -r "../PhysioRecord-Web-PWA-${VERSION_TAG}.zip" .

      - name: Upload Web PWA & SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa-bundle
          path: |
            PhysioRecord-Web-PWA-*.zip
            sbom.cdx.json

  build-android-apk:
    name: Build Universal Android APK (Capacitor 8)
    needs: verify-and-build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm ci

      - name: Build Android web assets, hydrate Gradle wrapper & sync Capacitor
        run: |
          npm run build:android:web
          node scripts/prepare-android-template.mjs
          npx cap sync android

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/physiorecord-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/physiorecord-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Universal Android APK (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename Universal APK artifact
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-v1.0.0}}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v$(node -p "require('./package.json').version")"
          fi
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk "PhysioRecord-Android-Universal-${VERSION_TAG}.apk"
          else
            cp android/app/build/outputs/apk/debug/*.apk "PhysioRecord-Android-Universal-${VERSION_TAG}-debug.apk"
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-apk
          path: PhysioRecord-Android-Universal-*.apk

  build-windows-installer:
    name: Build Windows Setup & Portable EXE (Electron)
    needs: verify-and-build-web
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies & Electron packaging tools
        run: |
          npm ci
          npm install --no-save --save-exact electron@34.3.0 electron-builder@25.1.8

      - name: Build Desktop web assets & package Windows NSIS Setup + Portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:desktop:web
          npx electron-builder --win nsis portable --publish never -c.electronVersion=34.3.0

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish-github-release:
    name: Publish APK, EXE, Web PWA & SHA256SUMS to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs:
      - verify-and-build-web
      - build-android-apk
      - build-windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            CONTENT_LICENSES.md
