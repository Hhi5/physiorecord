name: Release Multi-Platform (Web PWA + Universal Android APK + Windows EXE)

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.2.0) to publish a GitHub Release when triggered manually'
        required: false
        type: string
      allow_unsigned_debug:
        description: 'Allow debug APK build if signing secrets are not yet configured (NEVER use for user upgrades!)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  verify-and-build-web:
    name: Verify Quality Gates & Build Web PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version metadata from release tag (when triggered by tag/input)
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/sync-version.mjs --version "$TAG"
          else
            node scripts/sync-version.mjs
          fi

      - name: Security audit (production dependencies, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: License compliance gate (GPL-3.0-or-later & allowlist)
        run: npm run check:licenses

      - name: Content license registry gate
        run: npm run check:content

      - name: TypeScript typecheck
        run: npm run lint

      - name: Unit & clinical verification tests
        run: npm test

      - name: Build Web PWA bundle
        run: npm run build:web

      - name: Performance budget check
        run: npm run check:perf

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Package Web PWA archive with GPL notices
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ ! "$VERSION_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_TAG="v$(node -p "require('./package.json').version")"
          fi
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v${VERSION_TAG}"
          fi
          cp LICENSE NOTICE docs/legal/THIRD_PARTY_NOTICES.md docs/legal/CONTENT_LICENSES.md dist/
          cd dist && zip -r "../PhysioRecord-Web-PWA-${VERSION_TAG}.zip" .

      - name: Upload Web PWA bundle for GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-pwa-bundle
          path: PhysioRecord-Web-PWA-*.zip

      - name: Upload CycloneDX SBOM (CI compliance artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compliance-sbom
          path: build/sbom.cdx.json

  build-android-apk:
    name: Build Universal Android APK (Capacitor 8)
    needs: verify-and-build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Enforce Persistent Release Keystore Signing Gate
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_UNSIGNED_DEBUG: ${{ inputs.allow_unsigned_debug }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/physiorecord-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/physiorecord-release.jks" >> "$GITHUB_ENV"
            echo "REQUIRE_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED_DEBUG" = "true" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::warning::Building unsigned debug APK because allow_unsigned_debug=true was manually set. This build CANNOT upgrade existing installs!"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing persistent Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "::error::Refusing to build an un-upgradeable debug APK that forces users to uninstall and lose IndexedDB data."
            echo "::error::Run 'npm run android:keystore:init' locally once and save the generated secrets in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Install project dependencies
        run: npm ci

      - name: Sync version metadata & build Android web assets + Gradle wrapper
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/sync-version.mjs --version "$TAG"
          else
            node scripts/sync-version.mjs
          fi
          npm run build:android:web
          node scripts/prepare-android-template.mjs
          npx cap sync android

      - name: Assemble Universal Android APK (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_KEYSTORE_SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          chmod +x ./gradlew
          if [ "$IS_KEYSTORE_SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename Universal APK & Verify Signing, Alignment & Manifest Integrity
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          IS_KEYSTORE_SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          VERSION_TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ ! "$VERSION_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_TAG="v$(node -p "require('./package.json').version")"
          fi
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v${VERSION_TAG}"
          fi
          if [ "$IS_KEYSTORE_SIGNED" = "true" ]; then
            OUT_APK="PhysioRecord-Android-Universal-${VERSION_TAG}.apk"
            if compgen -G "android/app/build/outputs/apk/release/*-unsigned.apk" > /dev/null; then
              echo "::error::Unsigned release APK detected! Refusing to publish an un-installable APK."
              exit 1
            fi
            SRC_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
            if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
              echo "::error::Expected signed release APK was not produced."
              exit 1
            fi
            cp "$SRC_APK" "$OUT_APK"

            BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
            APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
            AAPT2="${BUILD_TOOLS_DIR}/aapt2"

            if [ -x "$ZIPALIGN" ]; then
              echo "Verifying 4-byte APK alignment (required for resources.arsc on Android 11+)..."
              "$ZIPALIGN" -c -v 4 "$OUT_APK" >/dev/null
              echo "✅ zipalign -c 4 PASSED"
            fi

            if [ -x "$APKSIGNER" ]; then
              echo "Verifying APK Signature Schemes (v1, v2, v3) for minSdk 24+..."
              "$APKSIGNER" verify --verbose --min-sdk-version 24 --print-certs "$OUT_APK" | tee ANDROID_SIGNING_SHA256.txt
              if [ -n "$EXPECTED_SHA256" ]; then
                NORM_EXPECTED="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
                if ! grep -iFq "$NORM_EXPECTED" ANDROID_SIGNING_SHA256.txt; then
                  echo "::error::APK certificate SHA-256 mismatch! Aborting to prevent breaking in-place updates."
                  exit 1
                fi
              fi
            fi

            if [ -x "$AAPT2" ]; then
              echo "Verifying compiled AndroidManifest badging..."
              BADGING="$("$AAPT2" dump badging "$OUT_APK")"
              echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:|testOnly)" || true
              if echo "$BADGING" | grep -q "testOnly='-1'"; then
                echo "::error::APK has android:testOnly=true which blocks sideload installation!"
                exit 1
              fi
              APK_VCODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
              if [ -z "$APK_VCODE" ] || [ "$APK_VCODE" -lt 100000 ]; then
                echo "::error::APK versionCode (${APK_VCODE:-missing}) must be >= 100000 to prevent Android downgrade errors."
                exit 1
              fi
              echo "✅ Verified APK package badging (versionCode=${APK_VCODE})"
            fi

            sha256sum "$OUT_APK" | tee -a ANDROID_SIGNING_SHA256.txt
            ls -lh "$OUT_APK"
          else
            cp android/app/build/outputs/apk/debug/*.apk "PhysioRecord-Android-Universal-${VERSION_TAG}-debug.apk"
          fi

      - name: Upload Android APK for GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-universal-apk
          path: PhysioRecord-Android-Universal-*.apk

      - name: Upload Android signing report (CI verification artifact)
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-signing-report
          path: ANDROID_SIGNING_SHA256.txt
          if-no-files-found: ignore

  build-windows-installer:
    name: Build Windows Setup & Portable EXE (Electron)
    needs: verify-and-build-web
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Sync version metadata from release tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          TAG="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/sync-version.mjs --version "$TAG"
          else
            node scripts/sync-version.mjs
          fi

      - name: Install project dependencies & Electron packaging tools
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm install --no-save --save-exact electron@34.3.0 electron-builder@25.1.8

      - name: Build Desktop web assets & package Windows NSIS Setup + Portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        shell: bash
        run: |
          npm run build:desktop:web
          npx electron-builder --config electron/electron-builder.yml --win nsis portable --publish never

      - name: Upload Windows EXE installers for GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exe-release
          path: release/*.exe

  publish-github-release:
    name: Publish Clean Platform Assets to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs:
      - verify-and-build-web
      - build-android-apk
      - build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download Web PWA artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-pwa-bundle
          path: release-assets

      - name: Download Android APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-universal-apk
          path: release-assets

      - name: Download Windows EXE artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-exe-release
          path: release-assets

      - name: Verify final platform release assets
        working-directory: release-assets
        run: ls -lh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
