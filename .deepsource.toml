version = 1

test_patterns = [
  "src/**/__tests__/**",
  "src/**/*.test.ts",
  "src/**/*.test.tsx",
  "e2e/**",
]

exclude_patterns = [
  "dist/**",
  "build/**",
  "android/app/build/**",
  "android/build/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "nodejs", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"
  cyclomatic_complexity_threshold = "high"

[[analyzers]]
name = "java"
enabled = true

  [analyzers.meta]
  runtime_version = "21"

[[analyzers]]
name = "secrets"
enabled = true
